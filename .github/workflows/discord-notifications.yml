name: Discord notifications

on:
  push:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, synchronize, closed]

permissions: {}

jobs:
  notify:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is not configured")

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          repo = os.environ["REPOSITORY"]
          actor = event.get("sender", {}).get("login", "unknown")
          if os.environ["EVENT_NAME"] == "push":
              branch = event["ref"].removeprefix("refs/heads/")
              title = f"푸시: {repo} / {branch}"
              url = event.get("compare") or f'{os.environ["SERVER_URL"]}/{repo}/commit/{event["after"]}'
              detail = f"{actor}님이 푸시했습니다."
          else:
              pr = event["pull_request"]
              action = event["action"]
              if action == "closed" and not pr["merged"]:
                  print("닫힌 PR은 알림 대상이 아닙니다.")
                  raise SystemExit(0)
              labels = {"opened": "생성", "reopened": "다시 열림", "edited": "변경", "ready_for_review": "리뷰 준비", "synchronize": "커밋 변경", "closed": "머지"}
              title = f'PR {labels[action]}: {repo} #{pr["number"]}'
              url = pr["html_url"]
              detail = f'{pr["title"]}\n{actor}님이 업데이트했습니다.'

          payload = json.dumps({"embeds": [{"title": title[:256], "description": detail[:4096], "url": url}], "allowed_mentions": {"parse": []}}).encode()
          request = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=15) as response:
              print(f"Discord notification sent: HTTP {response.status}")
          PY
